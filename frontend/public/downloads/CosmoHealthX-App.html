<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CosmoHealthX Platform</title>
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="theme-color" content="#050a16">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #050a16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #0b1325;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }
    .icon {
      width: 84px;
      height: 84px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(34, 211, 238, 0.25);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 0 0 10px;
      color: #ffffff;
    }
    p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin: 0 0 28px;
    }
    .btn {
      display: inline-block;
      background: #f59e0b;
      color: #050a16 !important;
      text-decoration: none;
      font-weight: 800;
      font-size: 15px;
      padding: 14px 32px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .btn:hover {
      background: #fbbf24;
      transform: translateY(-2px);
    }
    .badge {
      display: inline-block;
      margin-top: 24px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 4px 12px;
      border-radius: 8px;
    }
  </style>
  <script>
    // Automatic redirection into the platform
    window.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        if (window.location.origin && window.location.origin !== "null") {
          window.location.href = window.location.origin + "/dashboard";
        } else {
          window.location.href = "http://localhost:5173/dashboard";
        }
      }, 400);
    });
  </script>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="CosmoHealthX Icon" class="icon" onerror="this.src='https://raw.githubusercontent.com/favicon.ico'">
    <h1>CosmoHealthX Platform</h1>
    <p>Launching autonomous space telemedicine telemetry platform in dedicated standalone mode...</p>
    <a href="/dashboard" class="btn">Open CosmoHealthX</a>
    <div>
      <span class="badge">NASA STD-3001 PWA INSTALLED</span>
    </div>
  </div>
</body>
</html>
